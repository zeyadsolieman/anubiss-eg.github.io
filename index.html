.content{
  max-width:560px;
  margin:-70px auto 0;
  text-align:center;
  position:relative;
  z-index:2;
}
.logo{
  display:block;
  width:124px;
  height:124px;
  object-fit:cover;
  border-radius:50%;

  background:#0b0908;
}

  margin:4px 0 8px;
  font-family:Georgia,serif;
  font-size:clamp(34px,5vw,58px);

  color:var(--gold);
  text-shadow:0 0 16px rgba(240,156,56,.28), 0 3px 10px rgba(128,60,15,.5);
}
.tag{
  letter-spacing:3px;
  font-size:clamp(11px,1.8vw,15px);
  color:var(--gold2);
  font-weight:bold;
  margin-bottom:8px;
}
.sub{

  color:#e7d8c0;
  font-size:clamp(16px,2vw,20px);
}
.section{
  display:flex;
  align-items:center;
  gap:14px;
  justify-content:center;
  color:#d9a453;

  letter-spacing:5px;
  margin:24px auto 18px;
  max-width:600px;
}

  flex:1;

  background:linear-gradient(115deg,var(--panel1),var(--panel2) 55%,#23160eee);
  border:1px solid var(--line);
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
}
a:hover,a:focus-visible,.contact:hover,.contact:focus-visible{
  background:linear-gradient(115deg,#4a301a,#1a1512 55%,#362114);
  transform:translateY(-2px);
  box-shadow:0 10px 26px rgba(0,0,0,.35), 0 0 0 1px rgba(255,190,108,.25) inset;
  outline:none;
}
.icon{width:44px;font-weight:bold;color:#ffb35b;font-size:31px;text-align:center;flex:0 0 44px}
strong{font-size:17px;display:block}
small{display:block;margin-top:5px;font-size:12px;color:#c9b79d}
.arrow{margin-left:auto;color:#f4b565;font-size:24px;line-height:1}
.copy-btn{
  margin-left:auto;
  border:none;
  background:transparent;
  color:#ffbf6a;
  font-size:15px;
  cursor:pointer;
  padding:8px 0 8px 8px;
}
.copy-btn:hover{color:#ffd797}
footer{margin-top:26px;font-size:12px;letter-spacing:6px;color:#d5aa72;text-align:center}
.toast{
  position:fixed;
  left:50%; bottom:18px;
  transform:translateX(-50%);
  background:#15100d;
  color:#ffd69b;
  border:1px solid #9b6327;
  padding:10px 14px;
  border-radius:12px;
  box-shadow:0 12px 30px rgba(0,0,0,.35);
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease;
  font-size:14px;
}
.toast.show{opacity:1}
@media (max-width:700px){
  .page{padding:0 14px 26px}
  .hero{height:180px;background-position:center center}
  .content{margin-top:-56px}
  .logo{width:110px;height:110px}
  h1{font-size:clamp(28px,9vw,42px)}
  .sub{font-size:16px}
}
</style>
